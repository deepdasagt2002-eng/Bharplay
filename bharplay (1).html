<style>
:root{
  --bg:#f4f5fa;--surface:#ffffff;--surface2:#e9ebf4;--text:#141826;--muted:#5b6482;
  --line:#d9dcea;--accent:#4a54e1;--accent-ink:#ffffff;--mint:#0f9b78;--danger:#c63b4d;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0d1017;--surface:#161a25;--surface2:#222838;--text:#e9ecf5;--muted:#9aa3bd;
    --line:#293043;--accent:#8c96ff;--accent-ink:#0d1017;--mint:#3ddbb0;--danger:#ff7a8a;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0d1017;--surface:#161a25;--surface2:#222838;--text:#e9ecf5;--muted:#9aa3bd;
  --line:#293043;--accent:#8c96ff;--accent-ink:#0d1017;--mint:#3ddbb0;--danger:#ff7a8a;
  color-scheme:dark;
}
:root[data-theme="light"]{color-scheme:light}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:var(--bg);color:var(--text);
  font-family:"Avenir Next","Segoe UI",system-ui,-apple-system,Roboto,sans-serif;
  font-size:15px;line-height:1.45;
}
a{color:inherit;text-decoration:none}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
svg{display:block;flex:none}
[hidden]{display:none!important}
.muted{color:var(--muted)}

}
.authbox .logo{font-size:24px;gap:12px}
.authbox .logo i{width:52px;height:52px;border-radius:13px}
.search{flex:1;max-width:620px;margin:0 auto;display:flex}
.search input{
  flex:1;min-width:0;height:40px;padding:0 16px;background:var(--surface);
  border:1px solid var(--line);border-right:0;border-radius:20px 0 0 20px;
}
.search button{
  width:60px;height:40px;background:var(--surface2);border:1px solid var(--line);
  border-radius:0 20px 20px 0;display:grid;place-items:center;
}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;height:38px;padding:0 16px;border-radius:19px;
  background:var(--surface2);font-weight:600;white-space:nowrap;
}
.btn:hover{background:var(--line)}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.on{background:var(--text);color:var(--bg)}
.btn.danger{color:var(--danger)}
.btn.wide{width:100%}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.accwrap{position:relative;flex:none}
.iconbtn{width:38px;height:38px;flex:none;border-radius:50%;display:grid;place-items:center;background:var(--surface2)}
.iconbtn:hover{background:var(--line)}
.auththeme{position:fixed;top:16px;right:16px;z-index:101}
.top .btn{flex:none}
.search{min-width:0;position:relative}
.catpanel{
  display:none;position:absolute;left:0;top:46px;width:min(580px,100%);max-height:70vh;overflow-y:auto;z-index:40;
  background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 14px 14px;
  box-shadow:0 14px 36px rgba(10,12,24,.22);
}
.search:focus-within .catpanel{display:block}
.cphead{font-size:12.5px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:10px}
.cpgrid{display:flex;flex-wrap:wrap;gap:8px}
.cchip{display:inline-flex;align-items:center;height:34px;padding:0 14px;border-radius:17px;background:var(--surface2);font-weight:600;font-size:14px}
.cchip:hover,.cchip:focus-visible{background:var(--accent);color:var(--accent-ink)}
.me{
  width:36px;height:36px;border-radius:50%;background:var(--mint);color:var(--bg);
  display:grid;place-items:center;font-weight:700;
}
.menu{
  position:absolute;right:0;top:46px;width:250px;background:var(--surface);border:1px solid var(--line);
  border-radius:14px;padding:6px;box-shadow:0 12px 32px rgba(10,12,24,.22);z-index:30;
}
.menu .head{padding:10px 12px;border-bottom:1px solid var(--line);margin-bottom:6px;overflow-wrap:anywhere}
.menu .head b{display:block}
.menu .head small{color:var(--muted)}
.menu button{display:block;width:100%;text-align:left;padding:10px 12px;border-radius:9px;font-weight:600}
.menu button:hover{background:var(--surface2)}

/* ---------- layout ---------- */
.shell{display:flex;min-height:calc(100% - 60px)}
.rail{
  width:94px;flex:none;position:sticky;top:60px;align-self:flex-start;height:calc(100vh - 60px);
  display:flex;flex-direction:column;gap:4px;padding:10px 6px;
}
.rail a{
  display:flex;flex-direction:column;align-items:center;gap:5px;padding:10px 0;border-radius:12px;
  font-size:11.5px;color:var(--muted);
}
.rail a:hover{background:var(--surface2)}
.rail a[aria-current="page"]{color:var(--text);background:var(--surface2);font-weight:700}
main{flex:1;min-width:0;padding:16px 24px 48px}
main.flush{padding:0}

/* ---------- chips ---------- */
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:14px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{
  flex:none;height:34px;padding:0 14px;border-radius:17px;background:var(--surface2);font-weight:600;font-size:14px;
}
.chip:hover{background:var(--line)}
.chip[aria-pressed="true"],.chip[aria-current="page"]{background:var(--text);color:var(--bg)}
a.chip{display:inline-flex;align-items:center}
a.chip.mobonly{display:none}
.railup{display:none;align-items:center;justify-content:center;flex:1}
.railup span{width:46px;height:46px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center}
.railup:hover span{filter:brightness(1.08)}

/* ---------- video grid ---------- */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:26px 16px}
.card{display:block}
.thumb{position:relative;aspect-ratio:16/9;border-radius:14px;overflow:hidden;background:var(--surface2)}
.thumb svg,.thumb img{width:100%;height:100%;object-fit:cover}
.dur{
  position:absolute;right:8px;bottom:8px;background:rgba(10,12,20,.82);color:#fff;font-size:12px;
  font-weight:600;padding:2px 6px;border-radius:6px;
}
.card:hover .thumb{box-shadow:0 0 0 2px var(--accent)}
.meta{display:flex;gap:12px;margin-top:11px}
.av{
  width:36px;height:36px;border-radius:50%;flex:none;display:grid;place-items:center;
  color:#fff;font-weight:700;font-size:14px;
}
.meta h3{
  font-size:15px;line-height:1.3;font-weight:650;display:-webkit-box;-webkit-line-clamp:2;
  -webkit-box-orient:vertical;overflow:hidden;
}
.meta p{color:var(--muted);font-size:13px}
.meta .stats{display:flex;gap:10px}
.plcard .meta{display:block}
.plcard .thumb{display:grid;place-items:center;color:var(--muted)}
.plcard .count{
  position:absolute;right:0;top:0;bottom:0;width:38%;background:rgba(10,12,20,.72);color:#fff;
  display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:700;gap:4px;
}

.empty{max-width:420px;margin:12vh auto 0;text-align:center;color:var(--muted)}
.empty h2{color:var(--text);font-size:20px;margin-bottom:8px}
.empty .btn{margin-top:18px}
.pagehead{display:flex;align-items:baseline;gap:12px;margin:4px 0 18px;flex-wrap:wrap}
.pagehead h1{font-size:22px;letter-spacing:-.01em}
.pagehead span{color:var(--muted)}
.pagehead .grow{flex:1}
.inline{display:flex;gap:10px;margin-bottom:22px;max-width:520px}
.inline input{
  flex:1;min-width:0;height:38px;padding:0 14px;background:var(--surface);border:1px solid var(--line);border-radius:19px;
}

/* ---------- watch ---------- */
.watch{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:24px;max-width:1500px;margin:0 auto}
.player{
  position:relative;aspect-ratio:16/9;background:#05060a;border-radius:16px;overflow:hidden;user-select:none;
}
.stage,.stage canvas,.stage video{width:100%;height:100%;display:block}
.stage video{object-fit:contain;background:#000}
.big{
  position:absolute;inset:0;margin:auto;width:76px;height:76px;border-radius:50%;
  background:rgba(10,12,20,.62);color:#fff;display:grid;place-items:center;transition:opacity .15s;
}
.player.playing .big{opacity:0;pointer-events:none}
.controls{
  position:absolute;left:0;right:0;bottom:0;padding:34px 14px 10px;color:#fff;
  background:linear-gradient(transparent,rgba(5,6,10,.85));transition:opacity .2s;
}
.player.playing:not(:hover):not(:focus-within) .controls{opacity:0}
.crow{display:flex;align-items:center;gap:10px;margin-top:4px}
.crow button,.crow select{height:34px;min-width:34px;padding:0 8px;border-radius:8px;color:#fff;display:grid;place-items:center}
.crow button:hover,.crow select:hover{background:rgba(255,255,255,.18)}
.crow select{background:transparent;border:0;appearance:none;text-align:center;font-weight:600;font-size:13px}
.crow select option{color:#000}
.time{font-size:13px;font-variant-numeric:tabular-nums;font-weight:600}
.sp{flex:1}
.seek{-webkit-appearance:none;appearance:none;width:100%;height:16px;background:transparent;cursor:pointer;display:block;--p:0%}
.seek::-webkit-slider-runnable-track{
  height:5px;border-radius:3px;background:linear-gradient(to right,var(--accent) var(--p),rgba(255,255,255,.3) var(--p));
}
.seek::-moz-range-track{height:5px;border-radius:3px;background:rgba(255,255,255,.3)}
.seek::-moz-range-progress{height:5px;border-radius:3px;background:var(--accent)}
.seek::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;border-radius:50%;background:#fff;margin-top:-4.5px}
.seek::-moz-range-thumb{width:14px;height:14px;border:0;border-radius:50%;background:#fff}

.notice{
  display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-top:10px;padding:10px 14px;
  background:var(--surface);border:1px solid var(--line);border-radius:12px;color:var(--muted);font-size:13.5px;
}
.notice .btn{height:32px;margin-left:auto;cursor:pointer}
.watch h1{font-size:20px;line-height:1.3;margin:14px 0 10px;letter-spacing:-.01em}
.bar{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.chan{display:flex;align-items:center;gap:12px;margin-right:auto}
.chan b{display:block;line-height:1.2}
.chan small{color:var(--muted)}
.seg{display:inline-flex;border-radius:19px;background:var(--surface2);overflow:hidden}
.seg button{display:flex;align-items:center;gap:8px;height:38px;padding:0 15px;font-weight:600}
.seg button:hover{background:var(--line)}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.desc{margin-top:14px;padding:12px 14px;background:var(--surface);border:1px solid var(--line);border-radius:14px}
.desc .n{font-weight:700;margin-bottom:4px;display:flex;gap:14px;flex-wrap:wrap}
.desc p{max-width:75ch;white-space:pre-line}
.desc.clamp p{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.desc button{margin-top:6px;font-weight:700;color:var(--accent)}
.comments{margin-top:22px}
.comments h2{font-size:17px;margin-bottom:14px}
.cform{display:flex;gap:12px;margin-bottom:20px}
.cform .grow{flex:1}
.cform textarea{
  width:100%;resize:vertical;min-height:44px;padding:10px 12px;background:var(--surface);
  border:1px solid var(--line);border-radius:12px;
}
.cform .acts{display:flex;justify-content:flex-end;margin-top:8px}
.cm{display:flex;gap:12px;margin-bottom:18px}
.cm .who{font-weight:700;font-size:13.5px}
.cm .who span{color:var(--muted);font-weight:400;margin-left:8px}
.cm p{max-width:75ch;overflow-wrap:anywhere}
.related{display:flex;flex-direction:column;gap:12px}
.related h2{font-size:15px;color:var(--muted);font-weight:600}
.rel{display:flex;gap:10px;padding:4px;border-radius:12px}
.rel[aria-current="true"]{background:var(--surface2)}
.rel .thumb{width:168px;flex:none;border-radius:10px}
.rel h3{font-size:14px;line-height:1.3;font-weight:650;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.rel p{font-size:12.5px;color:var(--muted)}
.sec{font-size:17px;margin:30px 0 6px}
.chrow{display:flex;align-items:center;gap:14px;padding:10px 0;border-bottom:1px solid var(--line);max-width:760px}
.chrow .info{flex:1;min-width:0}
.chrow b{display:block;line-height:1.25}
.chrow small{color:var(--muted)}
.prow{display:flex;align-items:center;gap:12px;max-width:760px;margin-bottom:8px}
.prow .rel{flex:1;min-width:0}

/* ---------- shorts ---------- */
.shorts{
  height:calc(100dvh - 60px);overflow-y:auto;scroll-snap-type:y mandatory;scrollbar-width:none;
}
.shorts::-webkit-scrollbar{display:none}
.short{
  position:relative;height:100%;scroll-snap-align:start;scroll-snap-stop:always;
  display:flex;align-items:center;justify-content:center;gap:18px;padding:14px 0;
}
.sframe{
  position:relative;height:100%;aspect-ratio:9/16;max-width:100%;border-radius:20px;overflow:hidden;
  background:#05060a;cursor:pointer;
}
.sframe canvas{width:100%;height:100%;display:block}
.sinfo{
  position:absolute;left:0;right:0;bottom:0;padding:60px 16px 20px;color:#fff;
  background:linear-gradient(transparent,rgba(5,6,10,.78));
}
.sinfo .sch{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.sinfo p{font-weight:600;line-height:1.3;text-shadow:0 1px 6px rgba(0,0,0,.4)}
.ssub{height:30px;padding:0 13px;border-radius:15px;background:#fff;color:#0d1017;font-weight:700;font-size:13px}
.ssub[aria-pressed="true"]{background:rgba(255,255,255,.28);color:#fff}
.spause{
  position:absolute;inset:0;margin:auto;width:84px;height:84px;border-radius:50%;
  background:rgba(10,12,20,.55);color:#fff;display:grid;place-items:center;pointer-events:none;transition:opacity .15s;
}
.sframe.playing .spause{opacity:0}
.sprog{position:absolute;left:0;right:0;bottom:0;height:4px;background:rgba(255,255,255,.28)}
.sprog i{display:block;height:100%;width:0;background:var(--accent)}
.sacts{display:flex;flex-direction:column;gap:16px;align-self:flex-end;padding-bottom:20px}
.sbtn{display:flex;flex-direction:column;align-items:center;gap:5px;font-size:12.5px;font-weight:600}
.ssub.attach{display:inline-grid;place-items:center;cursor:pointer}
.sframe video{width:100%;height:100%;display:block;object-fit:cover;background:#000}
.sbtn .ci{width:50px;height:50px;border-radius:50%;background:var(--surface2);display:grid;place-items:center}
.sbtn:hover .ci{background:var(--line)}
.sbtn[aria-pressed="true"] .ci{background:var(--accent);color:var(--accent-ink)}

/* ---------- dialogs ---------- */
dialog{
  margin:auto;width:min(520px,calc(100% - 28px));border:1px solid var(--line);border-radius:18px;
  background:var(--surface);color:var(--text);padding:0;
}
dialog::backdrop{background:rgba(5,7,14,.6)}
.dlg{padding:22px;display:flex;flex-direction:column;gap:14px}
.dlg h2{font-size:19px}
.field{display:flex;flex-direction:column;gap:6px;font-weight:600;font-size:13.5px}
.field input,.field select,.field textarea{
  padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);font-weight:400;
}
.kind{border:0;display:flex;gap:6px 20px;flex-wrap:wrap;font-weight:600;font-size:13.5px}
.kind legend{margin-bottom:6px;font-weight:600}
.kind label{display:flex;gap:8px;align-items:center;font-weight:400}
.kind input{accent-color:var(--accent)}
.srv{margin-top:2px;font-size:13.5px}
.srv summary{cursor:pointer;font-weight:600;color:var(--muted);padding:4px 0}
.srv .inline{margin:8px 0 6px;max-width:none}
.srv p{margin-top:6px}
.drop{border:1.5px dashed var(--line);border-radius:12px;padding:18px;text-align:center;color:var(--muted);font-weight:400}
.dlg .row{display:flex;justify-content:flex-end;gap:10px;margin-top:4px}
.plrow{
  display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:10px;font-weight:600;cursor:pointer;
}
.plrow:hover{background:var(--surface2)}
.plrow span{flex:1;overflow-wrap:anywhere}
.plrow small{color:var(--muted);font-weight:400}
.plrow input{width:18px;height:18px;accent-color:var(--accent)}
.pllist{max-height:240px;overflow-y:auto;border:1px solid var(--line);border-radius:12px;padding:4px}
.toast{
  position:fixed;left:50%;bottom:88px;transform:translateX(-50%);background:var(--text);color:var(--bg);
  padding:10px 18px;border-radius:12px;font-weight:600;z-index:200;
}

/* ---------- sign in ---------- */
.auth{position:fixed;inset:0;z-index:100;background:var(--bg);display:grid;grid-template-columns:1fr 1fr;overflow-y:auto}
.auth .art{position:relative;overflow:hidden}
.auth .art svg{position:absolute;inset:0;width:100%;height:100%}
.auth .art div{
  position:absolute;left:48px;right:48px;bottom:56px;color:#fff;font-size:30px;line-height:1.2;font-weight:700;letter-spacing:-.02em;
  max-width:14em;
}
.authbox{align-self:center;justify-self:center;width:min(380px,calc(100% - 40px));padding:30px 0;display:flex;flex-direction:column;gap:14px}
.authbox h1{font-size:26px;letter-spacing:-.02em;margin-top:10px}
.authbox form{display:flex;flex-direction:column;gap:14px}
.authbox .err{color:var(--danger);font-weight:600;font-size:13.5px;min-height:1.2em}
.authbox .or{text-align:center;color:var(--muted);font-size:13px}
.linkbtn{color:var(--accent);font-weight:700;text-align:left}

/* ---------- drawer (left swipe menu) ---------- */
.scrim{position:fixed;inset:0;background:rgba(5,7,14,.5);z-index:55}
.drawer{
  position:fixed;top:0;left:0;bottom:0;width:min(300px,82vw);background:var(--surface);border-right:1px solid var(--line);
  z-index:60;transform:translateX(-102%);transition:transform .22s ease;display:flex;flex-direction:column;padding:12px;
}
.drawer.open{transform:none;box-shadow:12px 0 40px rgba(5,7,14,.28)}
.dhead{display:flex;align-items:center;gap:12px;padding:4px 4px 14px}
.dhead .logo{flex:1}
.dnav{display:flex;flex-direction:column;gap:2px}
.dnav a{display:flex;align-items:center;gap:16px;padding:13px 14px;border-radius:12px;font-weight:600}
.dnav a:hover,.dnav a[aria-current="page"]{background:var(--surface2)}
.dnav a[aria-current="page"]{font-weight:800}
.livecount{margin-left:auto;font-size:12px;font-weight:700;color:var(--danger)}

/* ---------- live ---------- */
.livebadge{
  position:absolute;left:12px;top:12px;z-index:2;background:#e5384b;color:#fff;font-weight:800;font-size:12px;
  letter-spacing:.06em;padding:3px 8px;border-radius:6px;
}
.thumb .livebadge{left:8px;top:8px}
.viewers{
  position:absolute;right:12px;top:12px;z-index:2;background:rgba(10,12,20,.72);color:#fff;font-size:12.5px;
  font-weight:600;padding:3px 9px;border-radius:6px;
}
.chat{
  display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:14px;
  height:min(620px,calc(100vh - 120px));min-height:360px;overflow:hidden;
}
.chat h2{padding:12px 14px;font-size:15px;border-bottom:1px solid var(--line)}
.msgs{flex:1;overflow-y:auto;padding:10px 14px;display:flex;flex-direction:column;gap:8px}
.msg{font-size:14px;overflow-wrap:anywhere}
.msg b{margin-right:8px;color:hsl(var(--h,220) 50% 50%)}
.msg.me b{color:var(--accent)}
.msg.fan{background:var(--surface2);border-radius:8px;padding:5px 9px;border-left:3px solid var(--mint)}
.chatform{display:flex;gap:8px;padding:10px;border-top:1px solid var(--line)}
.chatform input{flex:1;min-width:0;height:38px;padding:0 14px;background:var(--bg);border:1px solid var(--line);border-radius:19px}
.mbadge{
  font-style:normal;font-size:11px;font-weight:700;padding:2px 7px;border-radius:9px;margin:0 8px 0 0;
  background:var(--mint);color:var(--bg);vertical-align:middle;display:inline-block;
}
.chan .mbadge{margin:0 0 0 8px}

/* ---------- trending ---------- */
.trow{display:flex;align-items:center;gap:16px;padding:10px 0;max-width:900px}
.trow .rank{width:34px;flex:none;text-align:center;font-size:22px;font-weight:800;color:var(--muted)}
.trow .rank.top{color:var(--accent)}
.trow .thumb{width:220px;flex:none}
.trow:hover h3{text-decoration:underline}
.tinfo h3{font-size:16px;line-height:1.3;font-weight:650;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tinfo p{color:var(--muted);font-size:13px}
.tstats{display:flex;gap:10px}
.tdesc{margin-top:6px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

/* ---------- memberships ---------- */
.tiers{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px;max-width:760px;margin:6px 0 0}
.tier{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px}
.tier h3{font-size:16px}
.tier .price{font-size:22px;font-weight:800;margin:4px 0 8px}
.tier .price small{font-size:13px;font-weight:500;color:var(--muted)}
.tier ul{padding-left:18px;color:var(--muted);font-size:14px}
.chrow .acts{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.joinrow{display:flex;gap:8px;flex-wrap:wrap}

/* ---------- responsive ---------- */
@media (max-width:1100px){
  .watch{grid-template-columns:1fr}
  .rel .thumb{width:160px}
}
@media (max-width:860px){
  .auth{grid-template-columns:1fr}
  .auth .art{display:none}
}
@media (max-width:760px){
  .top{padding:0 12px;gap:10px}
  .logo span{display:none}
  .btn .lbl{display:none}
  .btn{padding:0 11px}
  .search button{width:48px}
  .shell{display:block}
  .rail{
    position:fixed;left:0;right:0;bottom:0;top:auto;width:auto;height:64px;flex-direction:row;
    justify-content:space-around;background:var(--bg);border-top:1px solid var(--line);z-index:20;padding:4px;gap:0;
  }
  .rail a{flex:1;padding:6px 0;font-size:10.5px;min-width:0}
  .rail a.deskonly{display:none}
  .railup{display:flex}
  .top #openUpload{display:none}
  a.chip.mobonly{display:inline-flex}
  main{padding:12px 14px 88px}
  main.flush{padding:0}
  .grid{grid-template-columns:1fr;gap:22px}
  .bar{gap:10px}
  .toast{bottom:80px}
  .shorts{height:calc(100dvh - 124px)}
  .short{padding:8px 0}
  .sframe{border-radius:0;aspect-ratio:auto;width:100%;max-width:520px}
  .sacts{position:absolute;right:12px;bottom:84px;padding:0;color:#fff;z-index:2}
  .sbtn .ci{background:rgba(10,12,20,.55);color:#fff}
}
@media (max-width:760px){
  .catpanel{position:fixed;left:12px;right:12px;top:64px;width:auto;max-height:62vh}
  .trow{gap:10px}
  .trow .rank{width:24px;font-size:18px}
  .trow .thumb{width:128px}
  .tdesc{display:none}
  .chat{height:420px;min-height:0}
  .chrow{flex-wrap:wrap}
  .chrow .acts{width:100%;justify-content:flex-start}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<header class="top">
  <button class="iconbtn" id="menuBtn" type="button" aria-label="Open menu" aria-expanded="false" aria-controls="drawer"></button>
  <a class="logo" href="#/" aria-label="Bharplay home">
    <i role="img" aria-label="Bharplay logo"></i>
    <span>Bharplay</span>
  </a>
  <form class="search" id="searchForm" role="search">
    <input id="q" type="search" placeholder="Search" aria-label="Search videos and channels" autocomplete="off">
    <div class="catpanel" id="catPanel">
      <div class="cphead" id="cpHead">Browse by category</div>
      <div class="cpgrid" id="catGrid"></div>
    </div>
    <button type="submit" aria-label="Search" id="searchIcon"></button>
  </form>
  <button class="btn primary" id="openUpload"><span id="upIcon"></span><span class="lbl">Upload</span></button>
  <button class="iconbtn themebtn" type="button" aria-label="Switch theme"></button>
  <div class="accwrap">
    <button class="me" id="meBtn" aria-label="Account menu" aria-haspopup="true" aria-expanded="false">?</button>
    <div class="menu" id="menu" hidden></div>
  </div>
</header>

<div class="shell">
  <nav class="rail" id="rail" aria-label="Main"></nav>
  <main id="main"></main>
</div>

<!-- upload -->
<dialog id="uploadDlg">
  <form class="dlg" id="uploadForm" method="dialog">
    <h2>Upload a video</h2>
    <label class="field">Video file
      <div class="drop"><input type="file" id="file" accept="video/*"><p style="margin-top:8px">Plays from your device. Nothing is sent anywhere.</p></div>
    </label>
    <label class="field">Title
      <input id="upTitle" maxlength="100" placeholder="Add a title" required>
    </label>
    <fieldset class="kind">
      <legend>Type</legend>
      <label><input type="radio" name="kind" value="video" checked> Video</label>
      <label><input type="radio" name="kind" value="short"> Short (vertical, up to 60 seconds)</label>
    </fieldset>
    <label class="field" id="catField">Category
      <select id="upCat"></select>
    </label>
    <label class="field">Description
      <textarea id="upDesc" rows="3" placeholder="Tell viewers what this video is about"></textarea>
    </label>
    <div class="row">
      <button type="button" class="btn" id="cancelUp">Cancel</button>
      <button type="submit" class="btn primary" id="publish" disabled>Publish</button>
    </div>
  </form>
</dialog>

<!-- save to playlist -->
<dialog id="plDlg">
  <form class="dlg" id="plForm" method="dialog">
    <h2>Save to playlist</h2>
    <div class="pllist" id="plList"></div>
    <label class="field">New playlist
      <div class="inline" style="margin:0;max-width:none">
        <input id="plName" maxlength="60" placeholder="Playlist name" autocomplete="off">
        <button type="button" class="btn" id="plCreate">Create</button>
      </div>
    </label>
    <div class="row"><button type="submit" class="btn primary">Done</button></div>
  </form>
</dialog>

<!-- sign in -->
<div class="auth" id="auth" hidden>
  <button class="iconbtn themebtn auththeme" type="button" aria-label="Switch theme"></button>
  <div class="art" aria-hidden="true">
    <svg viewBox="0 0 400 600" preserveAspectRatio="xMidYMid slice">
      <defs><linearGradient id="ag" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="hsl(228 60% 16%)"/><stop offset="1" stop-color="hsl(268 62% 38%)"/></linearGradient></defs>
      <rect width="400" height="600" fill="url(#ag)"/>
      <circle cx="290" cy="150" r="70" fill="hsl(300 85% 72%)" opacity=".32"/>
      <path d="M0 600V360Q100 300 200 360T400 340V600Z" fill="hsl(230 70% 58%)" opacity=".28"/>
      <path d="M0 600V430Q110 380 210 430T400 410V600Z" fill="hsl(260 70% 62%)" opacity=".3"/>
      <path d="M0 600V500Q120 460 220 500T400 485V600Z" fill="hsl(290 70% 66%)" opacity=".3"/>
    </svg>
    <div>Watch, save and share the videos worth your time.</div>
  </div>
  <div class="authbox">
    <span class="logo"><i role="img" aria-label="Bharplay logo"></i>Bharplay</span>
    <h1 id="authTitle">Sign in</h1>
    <p class="muted" id="authNote">Your account and data are stored in this browser only.</p>
    <form id="authForm" novalidate>
      <label class="field" id="nameField" hidden>Name
        <input id="aName" autocomplete="name" maxlength="40">
      </label>
      <label class="field">Email
        <input id="aEmail" type="email" autocomplete="email">
      </label>
      <label class="field">Password
        <input id="aPass" type="password" autocomplete="current-password">
      </label>
      <p class="err" id="authErr" role="alert"></p>
      <button class="btn primary wide" id="authSubmit" type="submit">Sign in</button>
    </form>
    <button class="linkbtn" id="authSwap" type="button">New here? Create an account</button>
    <div class="or">or</div>
    <button class="btn wide" id="guest" type="button">Continue as guest</button>
    <details class="srv" id="srvBox">
      <summary>Sync across devices</summary>
      <p class="muted" id="srvStatus"></p>
      <div class="inline">
        <input id="srvUrl" placeholder="http://localhost:3000" aria-label="Server address" autocomplete="off">
        <button type="button" class="btn" id="srvConnect">Connect</button>
      </div>
      <button type="button" class="linkbtn" id="srvOff" hidden>Use browser storage instead</button>
    </details>
  </div>
</div>

<div class="scrim" id="scrim" hidden></div>
<aside class="drawer" id="drawer" aria-label="More from Bharplay" inert>
  <div class="dhead">
    <span class="logo"><i role="img" aria-label="Bharplay logo"></i>Bharplay</span>
    <button class="iconbtn" id="drawerClose" type="button" aria-label="Close menu"></button>
  </div>
  <nav class="dnav" id="drawerNav" aria-label="More"></nav>
</aside>

<div class="toast" id="toast" hidden role="status"></div>

<script>
/* ============ icons ============ */
const P={
  home:'<path d="M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>',
  shorts:'<rect x="7" y="2.500" width="10" height="19" rx="3"/><path d="M10.500 9.500v5l4-2.500z"/>',
  subs:'<rect x="3" y="5" width="18" height="14" rx="3"/><path d="M10 9.500v5l4.500-2.500z"/>',
  lists:'<path d="M4 6h12M4 11h12M4 16h7M17 14v6l4-3z"/>',
  liked:'<path d="M7 11v9H4v-9zM7 11l4-8c1.600 0 2.600 1.200 2.200 2.700L12.600 9H19a2 2 0 0 1 2 2.300l-1.200 7A2 2 0 0 1 17.800 20H7"/>',
  down:'<path d="M17 13V4h3v9zM17 13l-4 8c-1.600 0-2.600-1.200-2.200-2.700L11.400 15H5a2 2 0 0 1-2-2.300l1.200-7A2 2 0 0 1 6.200 4H17"/>',
  history:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
  upload:'<path d="M12 16V4M7 9l5-5 5 5M4 20h16"/>',
  search:'<circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/>',
  play:'<path d="M7 4l13 8-13 8z" fill="currentColor"/>',
  pause:'<path d="M7 4h3.500v16H7zM13.500 4H17v16h-3.500z" fill="currentColor"/>',
  replay:'<path d="M4 12a8 8 0 1 0 3-6.200M4 4v5h5"/>',
  fs:'<path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/>',
  share:'<path d="M4 12v7a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-7M12 15V3M7 8l5-5 5 5"/>',
  mute:'<path d="M4 9v6h4l5 4V5L8 9zM16 9l5 6M21 9l-5 6"/>',
  vol:'<path d="M4 9v6h4l5 4V5L8 9zM16.500 8.500a5 5 0 0 1 0 7M19 6a8.500 8.500 0 0 1 0 12"/>',
  bell:'<path d="M6 16V11a6 6 0 0 1 12 0v5l2 2H4zM10 21h4"/>',
  save:'<path d="M5 4h14v17l-7-4-7 4z"/>',
  plus:'<path d="M12 5v14M5 12h14"/>',
  menu:'<path d="M4 6h16M4 12h16M4 18h16"/>',
  close:'<path d="M6 6l12 12M18 6L6 18"/>',
  live:'<circle cx="12" cy="12" r="2"/><path d="M7.800 7.800a6 6 0 0 0 0 8.400M16.200 7.800a6 6 0 0 1 0 8.400M4.900 4.900a10 10 0 0 0 0 14.200M19.100 4.900a10 10 0 0 1 0 14.200"/>',
  trending:'<path d="M3 17l6-6 4 4 8-8M15 7h6v6"/>',
  members:'<path d="M12 3l2.700 5.600 6.100.9-4.400 4.300 1 6.100L12 17l-5.400 2.900 1-6.100L3.200 9.500l6.100-.9z"/>',
  sun:'<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.900 4.900l1.400 1.400M17.700 17.700l1.400 1.400M2 12h2M20 12h2M4.900 19.100l1.400-1.400M17.700 6.300l1.400-1.400"/>',
  moon:'<path d="M20 14.500A8.500 8.500 0 0 1 9.500 4 8.500 8.500 0 1 0 20 14.500z"/>',
  lib:'<rect x="4" y="9" width="16" height="11" rx="2"/><path d="M7 6h10M9.500 3h5"/>'
};
const ic=(n,s=22)=>`<svg viewBox="0 0 24 24" width="${s}" height="${s}" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${P[n]}</svg>`;

/* ============ storage (Claude artifacts storage, then browser localStorage, then memory) ============ */
const store=(()=>{
  const mem={};
  const hasWS=typeof window.storage?.get==='function'&&typeof window.storage?.set==='function';
  let ls=null;try{localStorage.setItem('_t','1');localStorage.removeItem('_t');ls=localStorage}catch(_){}
  return{
    async get(k){
      try{
        if(hasWS){const r=await window.storage.get(k);return r?JSON.parse(r.value):null}
        if(ls){const s=ls.getItem(k);return s?JSON.parse(s):null}
      }catch(_){}
      return k in mem?mem[k]:null;
    },
    async set(k,v){
      mem[k]=v;
      try{
        if(hasWS)await window.storage.set(k,JSON.stringify(v));
        else if(ls)ls.setItem(k,JSON.stringify(v));
      }catch(_){}
    }
  };
})();

/* ============ theme: light, dark, or follow the device ============ */
const mq=window.matchMedia('(prefers-color-scheme:dark)');
let themePref='auto';
const isDark=()=>themePref==='dark'||(themePref==='auto'&&mq.matches);
function applyTheme(){
  const r=document.documentElement;
  if(themePref==='auto')r.removeAttribute('data-theme');else r.setAttribute('data-theme',themePref);
  const label=isDark()?'Switch to light mode':'Switch to dark mode';

function fmtCount(n){
  if(n>=1e6)return (n/1e6).toFixed(n>=1e7?0:1).replace(/\.0$/,'')+'M';
  if(n>=1e3)return (n/1e3).toFixed(n>=1e4?0:1).replace(/\.0$/,'')+'K';
  return String(n);
}
function fmtTime(s){
  s=Math.max(0,Math.floor(s||0));
  const h=Math.floor(s/3600),m=Math.floor(s%3600/60),sec=s%60;
  return (h?h+':'+String(m).padStart(2,'0'):m)+':'+String(sec).padStart(2,'0');
}
function ago(ts){
  const m=Math.floor((Date.now()-ts)/60000);
  if(m<1)return 'Just now';
  if(m<60)return m+(m===1?' minute ago':' minutes ago');
  const h=Math.floor(m/60);if(h<24)return h+(h===1?' hour ago':' hours ago');
  const d=Math.floor(h/24);if(d<14)return d+(d===1?' day ago':' days ago');
  return Math.floor(d/7)+' weeks ago';
}

async function hashPw(pw,salt){
  const s=salt+':'+pw;
  if(window.crypto?.subtle){
    const buf=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));
    return [...new Uint8Array(buf)].map(b=>b.toString(16).padStart(2,'0')).join('');
  }
  let h=5381;for(const ch of s)h=((h<<5)+h+ch.charCodeAt(0))>>>0;
  return 'x'+h.toString(16);
}
const getUsers=async()=>(await store.get('lumen:users'))||[];
async function api(path,{method='GET',body}={}){
  const r=await fetch(net.base+path,{
    method,
    headers:{...(body?{'Content-Type':'application/json'}:{}),...(net.token?{Authorization:'Bearer '+net.token}:{})},
    body:body?JSON.stringify(body):undefined
  });
  let j=null;try{j=await r.json()}catch(_){}
  if(!r.ok){const e=new Error((j&&j.error)||'Request failed ('+r.status+')');e.status=r.status;throw e}
  return j;
}
async function pingServer(base){
  try{
    const r=await fetch(base+'/api/health',{cache:'no-store'});
    const j=await r.json();
    return !!(j&&(j.name==='bharplay'||j.name==='lumen'));
  }catch(_){return false}
}
async function detectServer(){
  const saved=await store.get('lumen:server');
  const tries=[];
  if(saved)tries.push(saved);
  if(/^https?:$/.test(location.protocol))tries.push('');
  for(const base of tries){
    if(await pingServer(base)){net.base=base;net.on=true;return}
  }
  net.base='';net.on=false;
}
async function signUp(name,email,pw){
  if(net.on){
    const r=await api('/api/signup',{method:'POST',body:{name,email,password:pw}});
    return{...r.user,remote:true,token:r.token};
  }
  const users=await getUsers();email=email.trim().toLowerCase();
  if(users.some(u=>u.email===email))throw new Error('An account with this email already exists. Sign in instead.');
  const salt=Math.random().toString(36).slice(2);
  const u={id:uid('u'),name:name.trim()||email.split('@')[0],email,salt,hash:await hashPw(pw,salt)};
  users.push(u);await store.set('lumen:users',users);
  return u;
}
async function signIn(email,pw){
  if(net.on){
    const r=await api('/api/signin',{method:'POST',body:{email,password:pw}});
    return{...r.user,remote:true,token:r.token};
  }
  const users=await getUsers();email=email.trim().toLowerCase();
  const u=users.find(x=>x.email===email);
  if(!u||u.hash!==await hashPw(pw,u.salt))throw new Error('Email or password is incorrect.');
  return u;
}

function closeDrawer(returnFocus=true){

  drawer.classList.remove('open');drawer.inert=true;scrim.hidden=true;

let tx=0,ty=0,tmode=null;
document.addEventListener('touchstart',e=>{
  if(e.touches.length!==1){tmode=null;return}
  const t=e.touches[0];tx=t.clientX;ty=t.clientY;
  if(drawer.classList.contains('open'))tmode='close';
  else tmode=(tx<=22&&$('#auth').hidden&&!document.querySelector('dialog[open]'))?'open':null;
},{passive:true});
document.addEventListener('touchend',e=>{
  if(!tmode)return;
  const t=e.changedTouches[0],dx=t.clientX-tx,dy=t.clientY-ty;
  if(Math.abs(dx)>60&&Math.abs(dx)>Math.abs(dy)*1.5){
    if(tmode==='open'&&dx>0)openDrawer();
    else if(tmode==='close'&&dx<0)closeDrawer();
  }
  tmode=null;
},{passive:true});

const CHAT_NAMES=['Aarav','Meera','Rohit','Sana','Dev','Lena','Kabir','Isha','Neha','Arjun','Tara','Vikram'];
const CHAT_GENERIC=['Hello everyone','First time here','Love this stream','Hi from Delhi','Good evening','Can you hear me?','Just subscribed'];
function liveWatchView(l){
  $('#main').innerHTML=`<div class="watch"><div class="primary">
      <div class="player" id="lplayer"><div class="stage"><canvas></canvas></div><span class="livebadge">LIVE</span><span class="viewers" id="lviewers"></span></div>
      <div class="notice"><span>Sample live stream: animated placeholder video and simulated chat.</span></div>

    <aside class="chat" aria-label="Live chat"><h2>Live chat</h2>
      <div class="msgs" id="msgs" role="log"></div>
      <form class="chatform" id="chatForm"><input id="chatIn" maxlength="150" placeholder="Say something" autocomplete="off" aria-label="Chat message"><button class="btn primary" type="submit">Send</button></form>
    </aside></div>`;
  const renderLiveBar=()=>{
    const c=chan(l.ch),sub=state.subs.has(l.ch),mem=memberOf(l.ch);
    $('#lbar').innerHTML=`<div class="chan">${avatar(l.ch,42)}<div><b>${esc(c.name)}</b><small>${fmtCount(c.subs+(sub?1:0))} subscribers</small>${mem?`<em class="mbadge">${esc(mem.tierName)}</em>`:''}</div></div>
      <button class="btn ${sub?'':'on'}" id="lsub">${sub?'Subscribed':'Subscribe'}</button>
      <a class="btn" href="#/memberships">Join</a>`;
    $('#lsub').onclick=()=>{
      state.subs.has(l.ch)?state.subs.delete(l.ch):state.subs.add(l.ch);save();
      toast(state.subs.has(l.ch)?`Subscribed to ${c.name}`:`Unsubscribed from ${c.name}`);renderLiveBar();
    };
  };
  renderLiveBar();
  const cv=$('#lplayer canvas'),t0=performance.now();let raf;
  const frame=now=>{const[ctx,w,h]=fitCanvas(cv);drawScene(ctx,w,h,(now-t0)/1000,l.hue);raf=requestAnimationFrame(frame)};
  raf=requestAnimationFrame(frame);
  let viewers=l.viewers;
  const showV=()=>{$('#lviewers').textContent=viewers.toLocaleString()+' watching'};showV();
  const vt=setInterval(()=>{viewers=Math.max(50,viewers+Math.round((Math.random()-.45)*l.viewers*.01));showV()},3000);
  const box=$('#msgs');
  const add=(name,text,cls='',badge='')=>{
    const atBottom=box.scrollHeight-box.scrollTop-box.clientHeight<40;
    let h=0;for(const ch of name)h=(h*31+ch.charCodeAt(0))%360;
    const d=document.createElement('div');d.className='msg '+cls;d.style.setProperty('--h',h);
    d.innerHTML=`${badge}<b>${esc(name)}</b><span>${esc(text)}</span>`;
    box.appendChild(d);
    while(box.children.length>80)box.firstChild.remove();
    if(atBottom)box.scrollTop=box.scrollHeight;
  };
  const pool=[...l.lines,...CHAT_GENERIC];
  const pick=a=>a[Math.floor(Math.random()*a.length)];
  for(let i=0;i<4;i++)add(pick(CHAT_NAMES),pick(pool));
  let timer;
  const tick=()=>{add(pick(CHAT_NAMES),pick(pool));timer=setTimeout(tick,1800+Math.random()*2200)};
  timer=setTimeout(tick,1500);
  $('#chatForm').onsubmit=e=>{
    e.preventDefault();
    const t=$('#chatIn').value.trim();if(!t)return;
    const mem=memberOf(l.ch);
    add(user.name,t,'me'+(mem&&mem.tier==='superfan'?' fan':''),mem?`<em class="mbadge">${esc(mem.tierName)}</em>`:'');
    $('#chatIn').value='';box.scrollTop=box.scrollHeight;
  };
  cleanup=()=>{cancelAnimationFrame(raf);clearInterval(vt);clearTimeout(timer)};
}

function subsView(only){

    ${mine.length?`<div class="chips" aria-label="Filter by channel">

    :`<p class="muted" style="max-width:52ch">You haven't subscribed to any channel yet. Subscribe below, or use the Subscribe button on any video, and their videos will show up here.</p>`}
    ${others.length?`<h2 class="sec">${mine.length?'Discover more channels':'Channels to subscribe to'}</h2>${others.map(k=>row(k,false)).join('')}`:''}`;
  const flip=(k,on)=>{
    on?state.subs.add(k):state.subs.delete(k);save();

/* ============ canvas scene + sizing ============ */
function drawScene(ctx,w,h,t,hue){
  const g=ctx.createLinearGradient(0,0,w,h);
  g.addColorStop(0,`hsl(${hue},55%,16%)`);g.addColorStop(1,`hsl(${(hue+50)%360},62%,34%)`);
  ctx.fillStyle=g;ctx.fillRect(0,0,w,h);
  const r=Math.min(w,h)*.5;
  const sun=ctx.createRadialGradient(w*.72,h*.3,0,w*.72,h*.3,r);
  sun.addColorStop(0,`hsla(${(hue+30)%360},90%,75%,.55)`);sun.addColorStop(1,'transparent');
  ctx.fillStyle=sun;ctx.fillRect(0,0,w,h);
  for(let i=0;i<5;i++){
    ctx.beginPath();ctx.moveTo(0,h);
    for(let x=0;x<=w;x+=8){
      const y=h*(.52+i*.09)+Math.sin(x/(w/(2.5+i))+t*(.5+i*.18)+i*1.7)*h*.055;
      ctx.lineTo(x,y);
    }
    ctx.lineTo(w,h);ctx.closePath();
    ctx.fillStyle=`hsla(${(hue+i*18)%360},70%,${48+i*7}%,.26)`;ctx.fill();
  }
}
function fitCanvas(cv){
  const dpr=window.devicePixelRatio||1,w=cv.clientWidth,h=cv.clientHeight;
  if(cv.width!==Math.round(w*dpr)||cv.height!==Math.round(h*dpr)){cv.width=Math.round(w*dpr);cv.height=Math.round(h*dpr)}
  const ctx=cv.getContext('2d');ctx.setTransform(dpr,0,0,dpr,0,0);
  return[ctx,w,h];
}

/* ============ player ============ */
function initPlayer(v,opts={}){
  const root=$('#player'),stage=$('.stage',root);
  const seek=$('.seek',root),timeEl=$('.time',root),pp=$('.pp',root),big=$('.big',root);
  const dur=()=>api.d||v.duration;
  let api,raf,was=false;

  if(v.src){
    const el=document.createElement('video');
    el.src=v.src;el.playsInline=true;stage.appendChild(el);
    api={
      get t(){return el.currentTime},set t(x){el.currentTime=x},
      get d(){return isFinite(el.duration)?el.duration:v.duration},
      get paused(){return el.paused},get ended(){return el.ended},
      play(){return el.play()},pause(){el.pause()},rate(r){el.playbackRate=r},el
    };
    const mute=$('.mute',root);
    if(mute)mute.onclick=()=>{el.muted=!el.muted;mute.innerHTML=ic(el.muted?'mute':'vol',20);mute.setAttribute('aria-label',el.muted?'Unmute':'Mute')};
    const tick=()=>{sync();raf=requestAnimationFrame(tick)};
    raf=requestAnimationFrame(tick);
    el.addEventListener('click',toggle);
  }else{
    const cv=document.createElement('canvas');stage.appendChild(cv);
    let t=0,last=performance.now(),playing=false,rate=1;
    const frame=now=>{
      const dt=(now-last)/1000;last=now;
      if(playing){t+=dt*rate;if(t>=v.duration){t=v.duration;playing=false}}
      const[ctx,w,h]=fitCanvas(cv);
      drawScene(ctx,w,h,t,v.hue);
      sync();raf=requestAnimationFrame(frame);
    };
    api={
      get t(){return t},set t(x){t=Math.min(Math.max(0,x),v.duration)},
      get d(){return v.duration},
      get paused(){return !playing},get ended(){return t>=v.duration},
      play(){if(t>=v.duration)t=0;playing=true},pause(){playing=false},rate(r){rate=r}
    };
    raf=requestAnimationFrame(frame);
    stage.addEventListener('click',toggle);
  }
  function sync(){
    const d=dur()||1,p=Math.min(100,api.t/d*100);
    seek.value=p*10;
    seek.style.setProperty('--p',p+'%');
    timeEl.textContent=`${fmtTime(api.t)} / ${fmtTime(d)}`;
    const playing=!api.paused&&!api.ended;
    if(playing)was=true;
    root.classList.toggle('playing',playing);
    const icon=api.ended?'replay':playing?'pause':'play';
    if(root.dataset.icon!==icon){
      root.dataset.icon=icon;
      pp.innerHTML=ic(icon,20);big.innerHTML=ic(icon==='pause'?'play':icon,34);
      const lbl=icon==='pause'?'Pause':icon==='replay'?'Replay':'Play';
      pp.setAttribute('aria-label',lbl);big.setAttribute('aria-label',lbl);
    }
    if(api.ended&&was){was=false;opts.onEnd&&opts.onEnd()}
  }
  function toggle(){
    if(api.ended)api.t=0;
    if(api.paused||api.ended){const r=api.play();r&&r.catch&&r.catch(()=>{})}else api.pause();
    sync();
  }
  big.onclick=toggle;pp.onclick=toggle;
  seek.oninput=()=>{api.t=seek.value/1000*dur();sync()};
  $('.rate',root).onchange=e=>api.rate(parseFloat(e.target.value));
  const fs=()=>{document.fullscreenElement?document.exitFullscreen():root.requestFullscreen&&root.requestFullscreen()};
  $('.fs',root).onclick=fs;

  function keys(e){
    if(/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName)&&e.target!==seek)return;
    if(e.target.tagName==='BUTTON'&&(e.key===' '||e.key==='Enter'))return;
    if(e.key===' '||e.key==='k'){e.preventDefault();toggle()}
    else if(e.key==='f'){fs()}
    else if(e.key==='ArrowRight'&&e.target!==seek){api.t=api.t+5;sync()}
    else if(e.key==='ArrowLeft'&&e.target!==seek){api.t=api.t-5;sync()}
    else if(e.key==='m'){$('.mute',root)?.click()}
  }
  document.addEventListener('keydown',keys);
  cleanup=()=>{
    cancelAnimationFrame(raf);document.removeEventListener('keydown',keys);
    api.pause();if(document.fullscreenElement)document.exitFullscreen();
  };
  if(opts.autoplay){const r=api.play();r&&r.catch&&r.catch(()=>{})}
}

/* ============ shorts ============ */
function shortList(){
  const mine=state.uploads.filter(u=>u.kind==='short').map(u=>({
    id:u.id,ch:'you',title:u.title,hue:u.hue,duration:u.duration||15,likes:u.likes||0,src:u.src,needsFile:u.needsFile,mine:true
  }));
  return[...mine,...SHORTS];
}
function shortsView(){
  const list=shortList();
  const m=$('#main');m.classList.add('flush');
  m.innerHTML=`<div class="shorts" id="shorts" tabindex="0" aria-label="Shorts. Scroll or use the up and down arrow keys.">${list.map((s,i)=>{
    const liked=state.react[s.id]==='like',subbed=state.subs.has(s.ch);
    return `<section class="short" data-i="${i}">
      <div class="sframe" data-i="${i}" role="button" aria-label="Play or pause">
        ${s.src?`<video src="${esc(s.src)}" loop playsinline preload="metadata"></video>`:'<canvas></canvas>'}
        <div class="spause">${ic('play',40)}</div>
        <div class="sinfo">
          <div class="sch">${avatar(s.ch,32)}<b>${esc(chan(s.ch).name)}</b>
            ${s.mine?'':`<button class="ssub" data-ch="${s.ch}" aria-pressed="${subbed}">${subbed?'Subscribed':'Subscribe'}</button>`}
            ${s.needsFile?`<label class="ssub attach">Attach file<input type="file" accept="video/*" data-att="${s.id}" hidden></label>`:''}
          </div>
          <p>${esc(s.title)}</p>
        </div>
        <div class="sprog"><i></i></div>
      </div>
      <div class="sacts">
        <button class="sbtn" data-like="${s.id}" aria-pressed="${liked}" aria-label="Like"><span class="ci">${ic('liked',24)}</span><small>${fmtCount(s.likes+(liked?1:0))}</small></button>
        ${s.src?`<button class="sbtn" data-mute aria-label="Mute"><span class="ci">${ic('vol',24)}</span><small>Sound</small></button>`:''}
        <button class="sbtn" data-share aria-label="Share"><span class="ci">${ic('share',24)}</span><small>Share</small></button>
      </div>
    </section>`}).join('')}</div>`;
  const wrap=$('#shorts');
  const frames=[...wrap.querySelectorAll('.sframe')];
  const vids=frames.map(f=>f.querySelector('video'));
  const times=list.map(()=>0);
  let active=0,playing=true,muted=false,last=performance.now(),raf;

  const setMuted=x=>{
    muted=x;
    vids.forEach(v=>{if(v)v.muted=x});
    wrap.querySelectorAll('[data-mute]').forEach(b=>{
      b.querySelector('.ci').innerHTML=ic(x?'mute':'vol',24);
      b.setAttribute('aria-label',x?'Unmute':'Mute');
    });
  };
  const apply=()=>{
    frames[active].classList.toggle('playing',playing);
    const v=vids[active];
    if(!v)return;
    if(playing){
      const r=v.play();
      if(r&&r.catch)r.catch(()=>{setMuted(true);v.play().catch(()=>{})});
    }else v.pause();
  };
  const setPlaying=p=>{playing=p;apply()};
  frames.forEach((f,i)=>f.onclick=()=>{if(i===active)setPlaying(!playing)});
  const io=new IntersectionObserver(es=>{
    es.forEach(e=>{
      if(e.isIntersecting&&e.intersectionRatio>=.6){
        const i=+e.target.dataset.i;
        if(i!==active){
          frames[active].classList.remove('playing');
          const pv=vids[active];if(pv){pv.pause();pv.currentTime=0}
          active=i;times[i]=0;
          const nv=vids[i];if(nv)nv.currentTime=0;
        }
        setPlaying(true);
      }
    });
  },{root:wrap,threshold:[.6]});
  wrap.querySelectorAll('.short').forEach(sec=>io.observe(sec));

  wrap.querySelectorAll('[data-like]').forEach(b=>b.onclick=()=>{
    const id=b.dataset.like,s=list.find(x=>x.id===id);
    state.react[id]=state.react[id]==='like'?undefined:'like';save();
    const on=state.react[id]==='like';
    b.setAttribute('aria-pressed',on);b.querySelector('small').textContent=fmtCount(s.likes+(on?1:0));
  });
  wrap.querySelectorAll('[data-share]').forEach(b=>b.onclick=shareLink);
  wrap.querySelectorAll('[data-mute]').forEach(b=>b.onclick=()=>setMuted(!muted));
  wrap.querySelectorAll('.ssub[data-ch]').forEach(b=>b.onclick=e=>{
    e.stopPropagation();
    const id=b.dataset.ch;
    state.subs.has(id)?state.subs.delete(id):state.subs.add(id);save();
    const on=state.subs.has(id);
    wrap.querySelectorAll(`.ssub[data-ch="${id}"]`).forEach(x=>{x.setAttribute('aria-pressed',on);x.textContent=on?'Subscribed':'Subscribe'});
    toast(on?`Subscribed to ${chan(id).name}`:`Unsubscribed from ${chan(id).name}`);
  });
  wrap.querySelectorAll('[data-att]').forEach(inp=>{
    inp.onclick=e=>e.stopPropagation();
    inp.parentElement.onclick=e=>e.stopPropagation();
    inp.onchange=e=>{
      const f=e.target.files[0];if(!f)return;
      const u=state.uploads.find(x=>x.id===inp.dataset.att);
      if(u){u.src=URL.createObjectURL(f);u.needsFile=false;route();toast('File attached')}
    };
  });

  function frame(now){
    const dt=(now-last)/1000;last=now;
    const s=list[active],f=frames[active],v=vids[active];
    let prog=0;
    if(v){
      prog=v.currentTime/(isFinite(v.duration)&&v.duration?v.duration:(s.duration||1));
    }else{
      if(playing){times[active]+=dt;if(times[active]>=s.duration)times[active]=0}
      const[ctx,w,h]=fitCanvas(f.querySelector('canvas'));
      drawScene(ctx,w,h,times[active],s.hue);
      prog=times[active]/s.duration;
    }
    f.querySelector('.sprog i').style.width=(Math.min(1,prog)*100)+'%';
    raf=requestAnimationFrame(frame);
  }
  raf=requestAnimationFrame(frame);
  const go=d=>{
    const i=Math.min(list.length-1,Math.max(0,active+d));
    wrap.querySelectorAll('.short')[i].scrollIntoView({behavior:'smooth',block:'start'});
  };
  const keys=e=>{
    if(/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName))return;
    if(e.key==='ArrowDown'||e.key==='j'){e.preventDefault();go(1)}
    else if(e.key==='ArrowUp'||e.key==='k'){e.preventDefault();go(-1)}
    else if(e.key==='m'){setMuted(!muted)}
    else if(e.key===' '&&e.target.tagName!=='BUTTON'){e.preventDefault();setPlaying(!playing)}
  };
  document.addEventListener('keydown',keys);
  cleanup=()=>{
    cancelAnimationFrame(raf);io.disconnect();document.removeEventListener('keydown',keys);
    vids.forEach(v=>{if(v)v.pause()});
  };
  wrap.focus({preventScroll:true});
}

/* ============ router ============ */
function route(){
  if(!user)return;
  cleanup();cleanup=()=>{};
  if($('#searchForm').contains(document.activeElement))document.activeElement.blur();
  const main=$('#main');main.classList.remove('flush');
  const[,a,b,c]=(location.hash.slice(1)||'/').split('/');
  let active='home';
  window.scrollTo(0,0);
  document.title='Bharplay';
  if(a==='watch'&&byId(b)){
    const v=byId(b);active='';document.title=v.title+' · Bharplay';watchView(v,c);
  }else if(a==='search'){
    const q=decodeURIComponent(b||'');$('#q').value=q;active='';searchView(q);
  }else if(a==='shorts'){
    active='shorts';document.title='Shorts · Bharplay';shortsView();
  }else if(a==='subs'){
    active='subs';document.title='Subscriptions · Bharplay';subsView(b);
  }else if(a==='playlists'){
    active='lists';playlistsView();
  }else if(a==='playlist'){
    active='lists';playlistView(b);
  }else if(a==='category'){
    active='';categoryView(b);
  }else if(a==='live'){
    active='';
    const l=LIVE.find(x=>x.id===b);
    if(l){document.title=l.title+' · Bharplay';liveWatchView(l)}else{document.title='Live · Bharplay';liveListView()}
  }else if(a==='trending'){
    active='';document.title='Trending · Bharplay';trendingView(b);
  }else if(a==='memberships'){
    active='';document.title='Memberships · Bharplay';membershipsView();
  }else if(a==='library'){
    active='lib';libraryView(b);
  }else if(a==='liked'||a==='history'||a==='later'){
    location.replace('#/library/'+a);return;
  }else{
    if(a&&a!=='')location.replace('#/');
    homeView();
  }
  renderRail(active);
}
window.addEventListener('hashchange',route);

$('#searchForm').addEventListener('submit',e=>{
  e.preventDefault();
  const q=$('#q').value.trim();
  $('#q').blur();
  location.hash=q?'#/search/'+encodeURIComponent(q):'#/';
});

/* ============ upload ============ */
const dlg=$('#uploadDlg'),fileIn=$('#file'),upTitle=$('#upTitle'),publish=$('#publish');
$('#upCat').innerHTML=CATS.map(c=>`<option>${c}</option>`).join('');
function openUpload(){
  $('#uploadForm').reset();$('#catField').hidden=false;
  publish.disabled=true;publish.textContent='Publish';
  dlg.showModal();
}
$('#openUpload').onclick=openUpload;
$('#cancelUp').onclick=()=>dlg.close();
document.querySelectorAll('input[name=kind]').forEach(r=>r.onchange=()=>{
  $('#catField').hidden=document.querySelector('input[name=kind]:checked').value==='short';
});
fileIn.onchange=()=>{
  const f=fileIn.files[0];
  publish.disabled=!f;
  if(f&&!upTitle.value)upTitle.value=f.name.replace(/\.[^.]+$/,'').slice(0,100);
};
function uploadToServer(file,onProgress){
  return new Promise((res,rej)=>{
    const x=new XMLHttpRequest();
    x.open('POST',net.base+'/api/upload?name='+encodeURIComponent(file.name));
    x.setRequestHeader('Authorization','Bearer '+net.token);
    x.setRequestHeader('Content-Type',file.type||'video/mp4');
    x.upload.onprogress=e=>{if(e.lengthComputable)onProgress(e.loaded/e.total)};
    x.onload=()=>{
      let j={};try{j=JSON.parse(x.responseText)}catch(_){}
      x.status<300&&j.url?res(j):rej(new Error(j.error||'Upload failed'));
    };
    x.onerror=()=>rej(new Error('Could not reach the server'));
    x.send(file);
  });
}
$('#uploadForm').addEventListener('submit',async e=>{
  e.preventDefault();
  const f=fileIn.files[0];if(!f)return;
  const kind=document.querySelector('input[name=kind]:checked').value;
  publish.disabled=true;publish.textContent='Checking video';
  const url=URL.createObjectURL(f),ts=Date.now();
  const probe=document.createElement('video');
  probe.muted=true;probe.preload='metadata';probe.src=url;
  const status=await new Promise(r=>{
    probe.onloadedmetadata=()=>r('ok');probe.onerror=()=>r('error');setTimeout(()=>r('slow'),5000);
  });
  publish.textContent='Publish';
  if(status==='error'){
    toast("This browser can't play that file. Try an MP4.");publish.disabled=false;URL.revokeObjectURL(url);return;
  }
  const d=isFinite(probe.duration)?probe.duration:0;
  if(kind==='short'&&d>60.5){
    toast('Shorts can be up to 60 seconds. Choose a shorter clip or upload it as a video.');
    publish.disabled=false;URL.revokeObjectURL(url);return;
  }
  const v={
    id:uid('up'),kind,ch:'you',title:upTitle.value.trim()||'Untitled video',cat:kind==='short'?'Short':$('#upCat').value,
    duration:d,views:0,age:'Just now',hue:Math.floor(Math.random()*360),seed:(++uploadSeq)*11,
    desc:$('#upDesc').value.trim(),likes:0,comments:[],src:url,needsFile:false,fileUrl:null,ts
  };
  probe.onseeked=()=>{
    try{
      const c=document.createElement('canvas');c.width=320;c.height=180;
      c.getContext('2d').drawImage(probe,0,0,320,180);v.thumb=c.toDataURL('image/jpeg',.7);
    }catch(_){}
    save();
    if(kind==='video'&&(location.hash===''||location.hash==='#/'))homeView();
  };
  if(d)probe.currentTime=Math.min(1,d/2);
  state.uploads.unshift(v);
  if(kind==='video')videos.unshift(v);
  save();
  dlg.close();toast('Published');
  if(kind==='short'){location.hash==='#/shorts'?route():(location.hash='#/shorts')}
  else location.hash='#/watch/'+v.id;
  if(user.remote){
    let lastPct=0;
    uploadToServer(f,p=>{const pct=Math.floor(p*20)*5;if(pct>lastPct){lastPct=pct;toast(`Uploading to the server: ${pct}%`)}})
      .then(r=>{v.fileUrl=r.url;save();toast('Saved to the server')})
      .catch(err=>toast(`Server upload failed: ${err.message}. The file stays on this device only.`));
  }
});
dlg.addEventListener('click',e=>{if(e.target===dlg)dlg.close()});

/* ============ boot ============ */
(async function boot(){
  await detectServer();
  const sess=await store.get('lumen:session');
  if(sess){
    if(sess.guest){await enterApp({id:'guest',name:'Guest',guest:true});return}
    if(sess.remote){
      if(net.on&&sess.token){
        net.token=sess.token;
        try{const me=await api('/api/me');await enterApp({...me,remote:true,token:sess.token});return}
        catch(_){net.token=null}
      }
      showAuth('in');
      if(!net.on)$('#authErr').textContent="Can't reach the server. Check that it's running, or connect to it below.";
      return;
    }
    const users=await getUsers();
    const u=users.find(x=>x.id===sess.id);
    if(u){await enterApp(u);return}
  }
  showAuth('in');
})();
window.addEventListener('pagehide',()=>{persist()});
</script>
